<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch Plan Editor</title>
<!--
  PATCH PLAN EDITOR — single-file, no dependencies.
  Structure of the script (search for the ==== banners):
    1. UTILITIES
    2. CONSTANTS & DEVICE PRESETS
    3. DATA MODEL / STORE   (pure JSON doc + transactional change log; no DOM)
    4. MODEL OPERATIONS     (all edits go through here -> Store)
    5. GEOMETRY             (device size, port positions)
    6. VIEW STATE           (pan/zoom, selection, UI flags — never saved in the doc)
    7. RENDERER             (doc -> SVG)
    8. CANVAS INTERACTION   (pointer handling: pan, zoom, select, drag)
    9. INSPECTOR            (right panel)
   10. LIBRARY              (left panel)
   11. KEYBOARD, CLIPBOARD & SELECTION COMMANDS
   12. LISTS                (cable list + port usage drawer, CSV)
   13. FILES                (save/open JSON, autosave)
   14. EXPORT               (SVG / PNG / print-to-PDF layout)
   15. VIEW MODE            (read-only) + File menu
   16. INIT
-->
<style>
/* ---------- Theme tokens ---------- */
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f5f6f8; --text:#1c2230; --muted:#687085;
  --border:#d7dbe2; --accent:#2f6fed; --accent-soft:rgba(47,111,237,.14);
  --canvas:#fafbfc; --grid:#e7e9ee; --grid2:#d3d8e0;
  --dev-body:#ffffff; --dev-text:#1c2230; --sel:#2f6fed; --warn:#d98a00; --danger:#d93636; --ok:#1f9d55;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--panel);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.icon{padding:0;width:32px}
button.on{background:var(--accent-soft);border-color:var(--accent)}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
input,select,textarea{border:1px solid var(--border);border-radius:5px;background:var(--panel);padding:5px 7px;min-height:30px;min-width:0}
input[type=color]{padding:2px;width:34px;height:30px;cursor:pointer}
label>input[type=color]{display:block;margin-top:3px;width:44px;height:34px}
input[type=checkbox]{width:18px;height:18px;min-height:0}
textarea{resize:vertical;min-height:56px;width:100%}
label{display:block;color:var(--muted);font-size:11.5px}
label>input:not([type=color]):not([type=checkbox]),label>select,label>textarea{display:block;width:100%;margin-top:3px;color:var(--text);font-size:13px}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:210px 1fr 350px;grid-template-rows:48px 1fr;height:100vh}
#topbar{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
#topbar .brand{font-weight:700;margin-right:6px;white-space:nowrap}
#topbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
#topbar .grow{flex:1}
#docName{width:180px;font-weight:600}
#library{background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:10px}
#center{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--canvas);touch-action:none;user-select:none;-webkit-user-select:none}
#canvas.panning,#canvas.panning *{cursor:grab!important}
#inspector{background:var(--panel);border-left:1px solid var(--border);overflow:auto;padding:12px}
#status{position:absolute;left:10px;bottom:8px;display:flex;gap:6px;pointer-events:none}
#status span{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11.5px;color:var(--muted);box-shadow:var(--shadow)}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
#toast div{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:6px;padding:7px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:520px}
#toast div.warn{border-left-color:var(--warn)}
#toast div.err{border-left-color:var(--danger)}

/* ---------- Library ---------- */
.lib-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px 8px}
.lib-item{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 8px;margin-bottom:4px;text-align:left;border-radius:7px;background:var(--panel2);border:1px solid transparent;cursor:grab}
.lib-item:hover{border-color:var(--accent)}
.lib-item .sw{width:14px;height:26px;border-radius:3px;flex:none}
.lib-item small{display:block;color:var(--muted);font-size:11px}
.lib-item .x{margin-left:auto;opacity:.5;padding:0 4px}
.lib-item .x:hover{opacity:1;color:var(--danger)}

/* ---------- Inspector ---------- */
.ins-h{display:flex;align-items:center;gap:6px;margin:2px 0 10px}
.ins-h h3{margin:0;font-size:14px;flex:1}
.ins-sec{border-top:1px solid var(--border);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.ins-sec h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:6px}
.row{display:flex;gap:6px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.row>.nf{flex:none}
.hint{color:var(--muted);font-size:12px}
.port-row{border:1px solid var(--border);border-radius:7px;padding:6px;display:flex;flex-direction:column;gap:5px;background:var(--panel2)}
.port-row.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.port-row .l1,.port-row .l2{display:flex;gap:5px;align-items:center}
.port-row .l1 input[data-pf=label]{flex:1;min-width:70px}
.port-row select{padding:4px 3px}
.port-row select[data-pf=dir]{width:68px;flex:none}
.port-row select[data-pf=type]{width:96px;flex:none}
.port-row select[data-pf=side]{width:86px;flex:none}
.port-row .l2 input{flex:1}
.port-row button{min-height:30px;padding:0 8px}
.addn{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.addn input{width:52px}

/* ---------- SVG canvas styles ---------- */
.dev{cursor:move}
.dev-body{fill:var(--dev-body);stroke-width:2}
.dev-hl{fill:none;stroke:var(--sel);stroke-width:2.5;display:none}
.dev.sel .dev-hl{display:block}
.dev-name{font-size:12px;font-weight:600;pointer-events:none}
.dev-note{cursor:help}
.port-label{font-size:10.5px;fill:var(--dev-text);pointer-events:none}
.port{cursor:crosshair}
.port-hit{fill:transparent}
.port:hover .port-hit,.port.focus .port-hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.dev-resize{fill:var(--sel);display:none;cursor:nwse-resize}
.dev.sel .dev-resize{display:block}
.marquee{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
body.viewmode .dev,body.viewmode .port{cursor:default}

/* cables */
.cable{cursor:pointer}
.cable-hit{fill:none;stroke:transparent;stroke-width:14}
.cable-halo{fill:none;stroke:var(--canvas);stroke-linejoin:round;stroke-linecap:round}
.cable-line{fill:none;stroke-linejoin:round;stroke-linecap:butt}
.cable-glow{fill:none;stroke:var(--sel);stroke-opacity:.35;stroke-linejoin:round;stroke-linecap:round;display:none}
.cable.sel .cable-glow{display:block}
.cable:hover .cable-halo{stroke:var(--accent-soft)}
.clabel{cursor:pointer}
.clabel rect{fill:var(--panel);stroke-width:1.5}
.clabel text{font-size:10px;font-weight:600;fill:var(--text)}
.clabel.warn rect{stroke:var(--warn)!important;stroke-dasharray:3 2;stroke-width:2}
.clabel.sel rect{stroke:var(--sel)!important;stroke-width:2.5}
body.chain-on .cable:not(.chain),body.chain-on .clabel:not(.chain){opacity:.1}
body.chain-on .dev:not(.chain){opacity:.3}
body.chain-on .cable.chain .cable-glow{display:block;stroke-opacity:.25}
body.chain-on .port.chain .port-hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
/* wiring feedback */
.wire-temp{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 4;pointer-events:none}
body.wiring .port.ok .port-hit{fill:rgba(31,157,85,.25);stroke:var(--ok);stroke-width:2}
body.wiring .port.mis .port-hit{fill:rgba(217,138,0,.15);stroke:var(--warn);stroke-width:1.5;stroke-dasharray:3 2}
body.wiring .port.target .port-hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
body.wiring .port.src .port-hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.wp{fill:var(--panel);stroke:var(--sel);stroke-width:2;cursor:move}
.endh{fill:var(--sel);stroke:var(--panel);stroke-width:2;cursor:crosshair}
.warnbox{background:rgba(217,138,0,.12);border:1px solid var(--warn);border-radius:6px;padding:7px 9px;font-size:12px;margin-bottom:8px}
.conn{display:flex;gap:8px;align-items:center}
.conn b{width:38px;color:var(--muted);font-weight:500}
.conn a{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
input.bad{border-color:var(--danger);box-shadow:0 0 0 2px rgba(217,54,54,.15)}
.sig-row{display:grid;grid-template-columns:40px 1fr 54px 50px 26px;gap:5px;align-items:center}
.sig-row input{min-width:0}
.sig-head{display:grid;grid-template-columns:40px 1fr 54px 50px 26px;gap:5px;font-size:10.5px;color:var(--muted)}
/* legend overlay */
#legend{position:absolute;right:10px;bottom:8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:6px;font-size:12px;min-width:210px;user-select:none}
#legend .lg-head{display:flex;align-items:center;gap:6px;padding:2px 4px 4px;font-weight:600}
#legend .lg-head span{flex:1}
#legend button{min-height:24px;padding:0 7px;font-size:11px}
#legend .lg-row{display:flex;align-items:center;gap:7px;padding:1px 4px;border-radius:5px;min-height:26px;cursor:pointer;font-size:11.5px}
#legend .lg-row:hover{background:var(--panel2)}
#legend .lg-row.off{opacity:.38}
#legend .lg-row .n{margin-left:auto;color:var(--muted);font-size:11px}
#legend .lg-row .only{visibility:hidden}
#legend .lg-row:hover .only{visibility:visible}
#legend.collapsed .lg-row{display:none}

/* ---------- Menus ---------- */
.menu{position:relative}
.menu-list{position:absolute;top:calc(100% + 4px);right:0;z-index:20;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:220px;display:none}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;width:100%;border:0;justify-content:space-between;gap:16px;background:none;text-align:left}
.menu-list button:hover{background:var(--panel2)}
.menu-list kbd,.kbd{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}
#topbar{overflow:visible}
#saveState{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---------- Bottom drawer: cable list / port usage ---------- */
#drawer{display:flex;flex-direction:column;height:280px;min-height:120px;background:var(--panel);border-top:1px solid var(--border);position:relative}
#drawer[hidden]{display:none}
#drawerResize{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:2}
.dr-head{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border);overflow-x:auto}
.dr-head input#tblFilter{width:170px;flex:0 1 170px}
.dr-head select{width:auto;max-width:150px}
.dr-head #tblSummary{white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--panel2);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;min-height:28px}
.tabs button.on{background:var(--panel);box-shadow:var(--shadow)}
.chk{display:flex;align-items:center;gap:5px;color:var(--text);font-size:12.5px;cursor:pointer}
.dr-body{flex:1;overflow:auto}
table.list{border-collapse:collapse;width:100%;font-size:12.5px}
table.list th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
table.list th.sorted::after{content:" ▲";font-size:9px}
table.list th.sorted.desc::after{content:" ▼"}
table.list td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap}
table.list td:last-child{white-space:normal;min-width:160px}
table.list tr{cursor:pointer}
table.list tbody tr:hover{background:var(--accent-soft)}
table.list tr.sel{background:var(--accent-soft)}
.sw-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.flag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600}
.flag.unused{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.flag.multi{background:rgba(217,54,54,.12);color:var(--danger);border:1px solid rgba(217,54,54,.4)}
.flag.ok{background:rgba(31,157,85,.12);color:var(--ok)}
.flag.warn{background:rgba(217,138,0,.14);color:var(--warn)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- View mode ---------- */
body.viewmode #library{opacity:.45;pointer-events:none}
body.viewmode #stMode{background:var(--accent);color:#fff;border-color:var(--accent)}
body.viewmode .edit-only{display:none!important}

/* ---------- Print layout (File > Print / PDF) ---------- */
#print{display:none}
@media print{
  @page{size:landscape;margin:10mm}
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  #app,#toast{display:none!important}
  #print{display:block;font:10.5pt/1.35 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#000}
  #print h1{font-size:16pt;margin:0 0 2mm}
  #print h2{font-size:12pt;margin:6mm 0 2mm;break-after:avoid}
  #print .pmeta{color:#555;margin-bottom:4mm}
  #print .pdrawing{border:1px solid #bbb;break-inside:avoid;page-break-after:always}
  #print .pdrawing svg{width:100%;height:auto;max-height:170mm;display:block}
  #print table{border-collapse:collapse;width:100%;font-size:9pt}
  #print th,#print td{border:1px solid #bbb;padding:1.5mm 2mm;text-align:left;vertical-align:top}
  #print th{background:#eee}
  #print td:first-child{white-space:nowrap}
  #print tr{break-inside:avoid}
  #print .plegend{display:flex;flex-wrap:wrap;gap:3mm 8mm;margin:3mm 0}
  #print .plegend span{display:inline-flex;align-items:center;gap:2mm}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <span class="brand">⚡ Patch Plan</span>
    <input id="docName" title="Project name">
    <span class="sep"></span>
    <button id="btnUndo" class="icon" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" class="icon" title="Redo (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button id="btnSnap" title="Snap to grid (G)">Snap</button>
    <button id="btnFit" title="Zoom to fit (F)">Fit</button>
    <button id="btnZoomOut" class="icon" title="Zoom out (-)">−</button>
    <button id="btnZoomIn" class="icon" title="Zoom in (+)">+</button>
    <span class="sep"></span>
    <select id="selRouting" title="Default cable routing (per-cable override in the inspector)">
      <option value="orthogonal">Orthogonal</option><option value="curved">Curved</option><option value="straight">Straight</option>
    </select>
    <button id="btnLabels" class="on" title="Show cable IDs on the canvas (L)">IDs</button>
    <button id="btnLists" title="Cable list & port usage (T)">☰ Lists</button>
    <span class="grow"></span>
    <span id="saveState"></span>
    <button id="btnView" title="Read-only view mode — look without accidentally editing">👁 View only</button>
    <span class="sep"></span>
    <div class="menu" id="menuFile">
      <button id="btnFile">File ▾</button>
      <div class="menu-list">
        <button data-cmd="new" class="edit-only">New project</button>
        <button data-cmd="open" class="edit-only">Open project (.json)… <kbd>Ctrl+O</kbd></button>
        <button data-cmd="save">Save project (.json) <kbd>Ctrl+S</kbd></button>
        <button data-cmd="save-view" title="Same file, but it opens in view-only mode">Save view-only copy (.json)</button>
        <hr>
        <button data-cmd="png">Export PNG image</button>
        <button data-cmd="svg">Export SVG drawing</button>
        <button data-cmd="print">Print / PDF (drawing + legend + list) <kbd>Ctrl+P</kbd></button>
        <hr>
        <button data-cmd="csv-cables">Cable list CSV</button>
        <button data-cmd="csv-ports">Port usage CSV</button>
      </div>
    </div>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  </header>

  <aside id="library"></aside>

  <main id="center">
    <div id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridMinor" patternUnits="userSpaceOnUse" width="20" height="20">
            <path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/>
          </pattern>
          <pattern id="gridMajor" patternUnits="userSpaceOnUse" width="100" height="100">
            <path d="M100 0H0V100" fill="none" stroke="var(--grid2)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect id="gridRectMinor" width="100%" height="100%" fill="url(#gridMinor)"/>
        <rect id="gridRectMajor" width="100%" height="100%" fill="url(#gridMajor)"/>
        <g id="world">
          <g id="L-cables"></g>
          <g id="L-devices"></g>
          <g id="L-labels"></g>
          <g id="L-overlay"></g>
        </g>
      </svg>
      <div id="status"><span id="stZoom">100%</span><span id="stCount"></span><span id="stMode" hidden></span></div>
      <div id="legend"></div>
      <div id="toast"></div>
    </div>
    <section id="drawer" hidden>
      <div id="drawerResize" title="Drag to resize"></div>
      <div class="dr-head">
        <div class="tabs"><button data-tab="cables" class="on">Cables</button><button data-tab="ports">Port usage</button></div>
        <input id="tblFilter" placeholder="Filter (ID, device, port, notes…)">
        <select id="tblType"></select>
        <label class="chk"><input type="checkbox" id="tblProblems"> Problems only</label>
        <span class="grow" style="flex:1"></span>
        <span id="tblSummary" class="hint"></span>
        <button id="btnCsv" title="Export the rows shown as CSV">CSV</button>
        <button id="btnDrawerClose" class="icon" title="Close (T)">✕</button>
      </div>
      <div class="dr-body"><table class="list" id="tbl"></table></div>
    </section>
  </main>

  <aside id="inspector"></aside>
</div>
<div id="print"></div>
<datalist id="connList">
  <option>powerCON TRUE1</option><option>powerCON 20A</option><option>Schuko</option><option>CEE 16A 1ph</option><option>CEE 16A 3ph</option><option>CEE 32A</option><option>CEE 63A</option><option>Socapex 19-pin</option><option>Harting 16</option><option>IEC C13</option>
  <option>RJ45 Cat6</option><option>etherCON Cat6</option><option>Fiber LC duplex</option><option>opticalCON DUO</option><option>XLR 5-pin</option><option>XLR 3-pin</option><option>HDMI</option><option>SDI BNC</option><option>DisplayPort</option><option>DVI</option><option>Jack 6.3 mm</option>
</datalist>

<script>
'use strict';
/* =====================================================================
   1. UTILITIES
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clone = o => (o == null ? o : JSON.parse(JSON.stringify(o)));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trunc = (s, n) => (s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s);
const snapV = v => Math.round(v / GRID) * GRID;
/** Black or white text depending on background colour. */
function textOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return '#fff';
  const n = parseInt(m[1], 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 150 ? '#111' : '#fff';
}
function toast(msg, kind = '', ms = 3200) {
  const d = document.createElement('div');
  d.className = kind; d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), ms);
}

/* =====================================================================
   2. CONSTANTS & DEVICE PRESETS
   ===================================================================== */
const GRID = 20;        // world units per grid cell
const HEADER = 20;      // device title bar height
const PITCH = 20;       // distance between ports on one side
const MIN_W = 100;
const SIDES = ['left', 'right', 'top', 'bottom'];
const DIRS = { in: 'In', out: 'Out', bi: 'Bidir' };
const SIGNAL_KEYS = ['power', 'network', 'dmx', 'video', 'audio', 'other'];
/* Default legend. Stored in the doc (meta.main.signals) so it is editable per project. */
const DEFAULT_SIGNALS = {
  power:   { label: 'Power',                    prefix: 'PWR', color: '#e5484d', width: 4.5, dash: '12 6' },

/* =====================================================================
   3. DATA MODEL / STORE
   ---------------------------------------------------------------------
   The document is plain JSON, organised as collections of entities keyed
   by id (easy to mirror 1:1 in Firebase/Supabase tables):
     doc = { schema, meta:{main:{...settings, legend, counters}},
             layers:{}, devices:{}, cables:{}, annotations:{} }
     device = { id, name, color, x, y, w, h, notes, layer, ports:[port] }
     port   = { id, label, dir:'in'|'out'|'bi', type, side, color|null, comment }
   Every edit runs inside Store.transact(); the store records a change list
   [{coll, id, before, after}] used for undo/redo and emitted to listeners.
   A realtime backend can subscribe to those change lists and push remote
   changes in through Store.applyRemote(changes).
   ===================================================================== */
const COLLS = ['meta', 'layers', 'devices', 'cables', 'annotations'];
function newDoc() {
  return {
    schema: 1,
    meta: { main: { id: 'main', name: 'Untitled show', signals: clone(DEFAULT_SIGNALS), counters: {}, routing: 'orthogonal' } },
    layers: {}, devices: {}, cables: {}, annotations: {},
  };
}
const Store = {
  doc: newDoc(),
  undoStack: [], redoStack: [],
  listeners: [],
  _tx: null,
  on(fn) { this.listeners.push(fn); },
  emit(ev) { for (const fn of this.listeners) fn(ev); },
  get main() { return this.doc.meta.main; },

  /** Replace the whole document (load / new). Clears history. */
  load(doc) {
    const base = newDoc();
    for (const c of COLLS) doc[c] = doc[c] || base[c];
    doc.meta.main = Object.assign(base.meta.main, doc.meta.main);
    for (const k of SIGNAL_KEYS) doc.meta.main.signals[k] = Object.assign({}, DEFAULT_SIGNALS[k], doc.meta.main.signals[k]);
    this.doc = doc; this.undoStack = []; this.redoStack = [];
    this.emit({ type: 'load' });
  },

  /** Run fn as one undoable step. opts.coalesce merges rapid edits of the same field. */
  transact(label, fn, opts = {}) {
    if (this._tx) { fn(); return; }              // nested: join the outer transaction
    const tx = this._tx = { label, changes: new Map() };
    try { fn(); } finally { this._tx = null; }
    if (!tx.changes.size) return;
    const changes = [...tx.changes.values()].map(c => ({ ...c, after: clone(this.doc[c.coll][c.id] ?? null) }));
    const now = Date.now(), last = this.undoStack[this.undoStack.length - 1];
    if (opts.coalesce && last && last.coalesce === opts.coalesce && now - last.t < 1500) {
      for (const c of changes) {
        const prev = last.changes.find(p => p.coll === c.coll && p.id === c.id);
        if (prev) prev.after = c.after; else last.changes.push(c);
      }
      last.t = now;
    } else {
      this.undoStack.push({ label, changes, t: now, coalesce: opts.coalesce });
      if (this.undoStack.length > 300) this.undoStack.shift();
    }
    this.redoStack = [];
    this.emit({ type: 'commit', label, changes, origin: opts.origin });
  },
  _touch(coll, id) {
    if (!this._tx) throw new Error('Store mutation outside transact()');
    const k = coll + ':' + id;
    if (!this._tx.changes.has(k)) this._tx.changes.set(k, { coll, id, before: clone(this.doc[coll][id] ?? null) });
  },
  add(coll, obj) { this._touch(coll, obj.id); this.doc[coll][obj.id] = obj; return obj; },
  update(coll, id, patch) { if (!this.doc[coll][id]) return; this._touch(coll, id); Object.assign(this.doc[coll][id], patch); },
  mutate(coll, id, fn) { if (!this.doc[coll][id]) return; this._touch(coll, id); fn(this.doc[coll][id]); },
  remove(coll, id) { if (!this.doc[coll][id]) return; this._touch(coll, id); delete this.doc[coll][id]; },

  _apply(changes, which) {
    for (const c of changes) {
      const v = clone(c[which]);
      if (v == null) delete this.doc[c.coll][c.id]; else this.doc[c.coll][c.id] = v;
    }
  },
  undo() {
    const e = this.undoStack.pop(); if (!e) return;
    this._apply([...e.changes].reverse(), 'before'); this.redoStack.push(e);
    this.emit({ type: 'undo', label: e.label, changes: e.changes.map(c => ({ ...c, before: c.after, after: c.before })) });
  },
  redo() {
    const e = this.redoStack.pop(); if (!e) return;
    this._apply(e.changes, 'after'); this.undoStack.push(e);
    this.emit({ type: 'redo', label: e.label, changes: e.changes });
  },
  /** Hook for a future realtime backend: apply changes made by someone else (not undoable locally). */
  applyRemote(changes) { this._apply(changes, 'after'); this.emit({ type: 'remote', changes }); },

/* =====================================================================
   4. MODEL OPERATIONS  (no DOM access in here)
   ===================================================================== */
const Ops = {
  makePort(p = {}) {
    return { id: uid('p_'), label: p.label || 'Port', dir: p.dir || 'in', type: p.type || 'other',
      side: p.side || defaultSide(p.dir || 'in'), color: p.color || null, comment: p.comment || '' };
  },
  makeDevice(preset, x, y) {
    return { id: uid('d_'), name: preset.name || 'Device', color: preset.color || '#4a5568',
      x: snapV(x), y: snapV(y), w: preset.w || 160, h: preset.h || 60, notes: preset.notes || '',
      layer: preset.layer || '', ports: (preset.ports || []).map(p => Ops.makePort(p)) };
  },
  addDevice(preset, x, y) {
    const d = Ops.makeDevice(preset, x, y);
    Store.transact('Add device', () => Store.add('devices', d));
    return d;
  },
  /** Delete devices / annotations / cables by id. Cables attached to deleted devices go too. */
  deleteItems(ids) {
    const set = new Set(ids);
    Store.transact('Delete', () => {
      for (const c of Object.values(Store.doc.cables))
        if (set.has(c.id) || set.has(c.from.dev) || set.has(c.to.dev)) Store.remove('cables', c.id);
      for (const id of ids) {
        if (Store.doc.devices[id]) Store.remove('devices', id);
        else if (Store.doc.annotations[id]) Store.remove('annotations', id);
      }
    });
  },
  removePort(devId, pid) {
    Store.transact('Remove port', () => {
      for (const c of Object.values(Store.doc.cables))
        if ((c.from.dev === devId && c.from.port === pid) || (c.to.dev === devId && c.to.port === pid)) Store.remove('cables', c.id);
      Store.mutate('devices', devId, d => { d.ports = d.ports.filter(p => p.id !== pid); });
    });
  },
  /** Insert a clipboard payload with fresh ids (cables between copied devices included). Returns new ids. */
  pasteData(data, dx, dy) {
    const newIds = [], devMap = {}, portMap = {};
    Store.transact('Paste', () => {
      for (const src of data.devices || []) {
        const d = clone(src);
        d.id = uid('d_'); d.x = src.x + dx; d.y = src.y + dy; devMap[src.id] = d.id;
        d.ports = d.ports.map(p => { const np = { ...p, id: uid('p_') }; portMap[src.id + '|' + p.id] = np.id; return np; });
        Store.add('devices', d); newIds.push(d.id);
      }
      for (const src of data.cables || []) {
        const fp = portMap[src.from.dev + '|' + src.from.port], tp = portMap[src.to.dev + '|' + src.to.port];
        if (!fp || !tp) continue;
        const c = clone(src);
        c.id = uid('c_'); c.code = Ops.nextCode(c.type);
        c.from = { dev: devMap[src.from.dev], port: fp }; c.to = { dev: devMap[src.to.dev], port: tp };
        c.waypoints = (c.waypoints || []).map(w => ({ x: w.x + dx, y: w.y + dy }));
        Store.add('cables', c);
      }
    });
    return newIds;
  },

  /* ----- cables ----- */
  /** Next unique human-readable cable ID, e.g. NET-014. Must run inside a transaction. */
  nextCode(type) {
    const prefix = (sigOf(type).prefix || 'CBL').toUpperCase();
    const used = new Set(Object.values(Store.doc.cables).map(c => c.code));
    let n = Store.main.counters[prefix] || 0, code;
    do { n++; code = `${prefix}-${String(n).padStart(3, '0')}`; } while (used.has(code));
    Store.mutate('meta', 'main', m => { m.counters = { ...m.counters, [prefix]: n }; });
    return code;
  },
  /** Create a cable between two port refs {dev, port}. Source/destination are normalised so `from` is the output side. */
  connect(from, to) {
    let a = findPort(from), b = findPort(to);
    if (!a || !b) return null;
    if ((a.dir === 'in' && b.dir !== 'in') || (a.dir === 'bi' && b.dir === 'out')) { [from, to] = [to, from]; [a, b] = [b, a]; }
    let c;
    Store.transact('Connect', () => {
      c = { id: uid('c_'), code: Ops.nextCode(a.type), type: a.type, color: null, label: '', length: '', connector: '', notes: '',

  },
  /** Warnings for a (proposed) connection. ignoreCid = the cable itself when checking an existing one. */
  connectionWarnings(from, to, ignoreCid) {
    const a = findPort(from), b = findPort(to), w = [];
    if (!a || !b) return ['Port missing (dangling cable)'];
    if (a.dir === 'in' && b.dir === 'in') w.push('Input → input');
    if (a.dir === 'out' && b.dir === 'out') w.push('Output → output');
    if (a.type !== b.type) w.push(`Signal mismatch: ${sigOf(a.type).label} → ${sigOf(b.type).label}`);
    const idx = getPortIndex();
    for (const [ref, p] of [[from, a], [to, b]]) {
      const n = (idx.get(ref.dev + '|' + ref.port) || []).filter(id => id !== ignoreCid).length;
      if (n) w.push(`“${p.label}” on ${Store.doc.devices[ref.dev].name} already has ${n} other cable${n > 1 ? 's' : ''}`);
    }
    return w;
  },
  /** Insert a waypoint at world point pt, keeping waypoint order along the cable. */
  insertWaypoint(cid, pt) {
    const res = Ops.waypointsWithInsert(Store.doc.cables[cid], pt); if (!res) return;
    Store.transact('Add bend point', () => Store.update('cables', cid, { waypoints: res.wps }));
    return res.i;
  },
  /** Pure helper: new waypoint list with pt inserted in path order -> {wps, i}. */
  waypointsWithInsert(c, pt) {

  /** Next numbered label for a batch of ports: "Out 9" after "Out 1..8". */
  nextPortNumber(dev, base) {

  addPorts(devId, n, dir, type, side) {
    const dev = Store.doc.devices[devId]; if (!dev) return;

    Store.transact('Reorder port', () => Store.mutate('devices', devId, d => {

      const side = d.ports[i].side;

      while (j >= 0 && j < d.ports.length && d.ports[j].side !== side) j += delta;

/* =====================================================================
   5. GEOMETRY
   Ports are spaced at a fixed PITCH so they line up with the grid; the
   device grows if it has more ports than fit in its set size.
   ===================================================================== */
const geomCache = new Map();   // dev.id -> {w,h,ports:{pid:{x,y,side,nx,ny}}} (relative coords)
function devGeom(dev) {
  let g = geomCache.get(dev.id);
  if (g) return g;
  const by = { left: [], right: [], top: [], bottom: [] };
  for (const p of dev.ports) (by[p.side] || by.right).push(p);
  const nV = Math.max(by.left.length, by.right.length), nH = Math.max(by.top.length, by.bottom.length);
  const w = Math.max(dev.w || 160, MIN_W, nH * PITCH + 2 * PITCH);
  const h = Math.max(dev.h || 60, HEADER + nV * PITCH + 10, HEADER + 30);
  const ports = {};
  by.left.forEach((p, i) => ports[p.id] = { x: 0, y: HEADER + PITCH / 2 + i * PITCH, side: 'left', nx: -1, ny: 0 });
  by.right.forEach((p, i) => ports[p.id] = { x: w, y: HEADER + PITCH / 2 + i * PITCH, side: 'right', nx: 1, ny: 0 });
  by.top.forEach((p, i) => ports[p.id] = { x: PITCH + i * PITCH, y: 0, side: 'top', nx: 0, ny: -1 });
  by.bottom.forEach((p, i) => ports[p.id] = { x: PITCH + i * PITCH, y: h, side: 'bottom', nx: 0, ny: 1 });
  g = { w, h, ports };
  geomCache.set(dev.id, g);
  return g;
}
/** Absolute port position + outward normal. */
function portPos(dev, pid) {
  const g = devGeom(dev), p = g.ports[pid];
  return p ? { x: dev.x + p.x, y: dev.y + p.y, nx: p.nx, ny: p.ny } : { x: dev.x, y: dev.y, nx: 0, ny: 0 };
}
function itemBounds(o) {
  if (o.ports) { const g = devGeom(o); return { x: o.x, y: o.y, w: g.w, h: g.h }; }
  return { x: o.x, y: o.y, w: o.w || 0, h: o.h || 0 };
}
const sigOf = type => Store.main.signals[type] || Store.main.signals.other;
const portColor = p => p.color || sigOf(p.type).color;
const cableColor = c => c.color || sigOf(c.type).color;
function findPort(ref) { const d = ref && Store.doc.devices[ref.dev]; return d ? d.ports.find(p => p.id === ref.port) : null; }

/** Port -> cable ids index, rebuilt lazily after every change. Key "devId|portId". */
let portIdx = null;
function getPortIndex() {
  if (portIdx) return portIdx;
  portIdx = new Map();
  for (const c of Object.values(Store.doc.cables))
    for (const r of [c.from, c.to]) { const k = r.dev + '|' + r.port; (portIdx.get(k) || portIdx.set(k, []).get(k)).push(c.id); }
  return portIdx;
}

/* ---------- Cable routing ----------
   Each route returns {d: SVG path, pts: polyline approximation (for hit/label/bend insertion), mid}. */
const STUB = 20;   // straight run out of a port before the first bend
const r1 = v => Math.round(v * 10) / 10;

  const A = Store.doc.devices[c.from.dev], B = Store.doc.devices[c.to.dev];
  return A && B ? [portPos(A, c.from.port), portPos(B, c.to.port)] : null;

function routeCable(c, override) {

  else { const pts = mode === 'straight' ? [a, ...wps, b] : orthoRoute(a, b, wps); r = { d: 'M' + pts.map(p => r1(p.x) + ' ' + r1(p.y)).join('L'), pts }; }

}
function simplify(pts) {
  const out = [];

    const q = out[out.length - 1];
    if (q && Math.abs(q.x - p.x) < 0.01 && Math.abs(q.y - p.y) < 0.01) continue;
    if (out.length >= 2) { const o = out[out.length - 2]; if ((Math.abs(o.x - q.x) < .01 && Math.abs(q.x - p.x) < .01) || (Math.abs(o.y - q.y) < .01 && Math.abs(q.y - p.y) < .01)) out.pop(); }
    out.push({ x: p.x, y: p.y });

}
function orthoRoute(a, b, wps) {
  const a1 = { x: a.x + a.nx * STUB, y: a.y + a.ny * STUB }, b1 = { x: b.x + b.nx * STUB, y: b.y + b.ny * STUB };
  if (!wps.length) return simplify(autoOrtho(a, b, a1, b1));

  for (const q of [...wps, b1]) {      // elbow between consecutive points, continuing the current axis first
    const p = pts[pts.length - 1];
    if (Math.abs(p.x - q.x) > .01 && Math.abs(p.y - q.y) > .01) { pts.push(horiz ? { x: q.x, y: p.y } : { x: p.x, y: q.y }); horiz = !horiz; }

   ===================================================================== */
const EXPORT_CSS = `
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.dev-body{fill:var(--dev-body);stroke-width:2}
.dev-name{font-size:12px;font-weight:600}
.port-label{font-size:10.5px;fill:var(--dev-text)}
.cable-halo{fill:none;stroke:var(--canvas);stroke-linejoin:round;stroke-linecap:round}
.cable-line{fill:none;stroke-linejoin:round}
.clabel rect{fill:var(--panel);stroke-width:1.5}
.clabel text{font-size:10px;font-weight:600;fill:var(--text)}
.clabel.warn rect{stroke:var(--warn);stroke-dasharray:3 2;stroke-width:2}
.lg text{font-size:12px;fill:var(--text)}
`;
const EXPORT_VARS = ['--canvas', '--dev-body', '--dev-text', '--text', '--panel', '--muted', '--border', '--warn', '--accent', '--accent-soft', '--grid', '--grid2'];
/** Resolve CSS custom properties so the exported file works in any SVG viewer. forceLight = print colours. */
function exportVars(forceLight) {
  const root = document.documentElement, prev = root.getAttribute('data-theme');
  if (forceLight) root.setAttribute('data-theme', 'light');
  const cs = getComputedStyle(root), out = {};
  for (const n of EXPORT_VARS) out[n] = cs.getPropertyValue(n).trim();
  if (forceLight) { if (prev == null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', prev); }
  return out;
}
function exportLayers() { return [L.cables, L.devices, L.labels]; }
/** Build a standalone SVG of the drawing (what is currently visible, minus selection/chain styling). */
function buildExportSVG({ legend = true, forceLight = false } = {}) {
  render();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const g of exportLayers()) {
    if (!g.childElementCount) continue;
    const b = g.getBBox(); if (!b.width && !b.height) continue;
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
  }
  if (!isFinite(x0)) return null;
  const pad = 30; x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  let body = '';
  for (const g of exportLayers()) {
    const c = g.cloneNode(true);
    c.querySelectorAll('.dev-resize,.cable-hit,.port-hit,.cable-glow,.dev-hl,title').forEach(n => n.remove());
    c.querySelectorAll('.sel,.chain,.focus,.ok,.mis,.target,.src').forEach(n => n.classList.remove('sel', 'chain', 'focus', 'ok', 'mis', 'target', 'src'));
    c.removeAttribute('id');
    body += new XMLSerializer().serializeToString(c);
  }
  let lg = '';
  if (legend) {
    const counts = {}; for (const c of Object.values(Store.doc.cables)) counts[c.type] = (counts[c.type] || 0) + 1;
    const used = SIGNAL_KEYS.filter(k => counts[k] && !UI.hiddenTypes.has(k));
    let lx = x0 + pad, ly = y1 + 6;
    lg = `<g class="lg"><text x="${lx}" y="${ly + 12}" font-weight="700">Legend</text>`;
    lx += 64;
    for (const k of used) {
      const s = sigOf(k), label = `${s.label} (${counts[k]})`;
      lg += `<line x1="${lx}" y1="${ly + 8}" x2="${lx + 30}" y2="${ly + 8}" stroke="${esc(s.color)}" stroke-width="${s.width}"${s.dash ? ` stroke-dasharray="${esc(s.dash)}"` : ''}/><text x="${lx + 38}" y="${ly + 12}">${esc(label)}</text>`;
      lx += 50 + label.length * 6.6;
    }
    lg += '</g>';
    x1 = Math.max(x1, lx + pad); y1 += 34;
  }
  const w = Math.ceil(x1 - x0), h = Math.ceil(y1 - y0);
  const vars = exportVars(forceLight);
  const svgText = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x0} ${y0} ${w} ${h}">`
    + `<style>${EXPORT_CSS}</style><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="var(--canvas)"/>${body}${lg}</svg>`;
  return { svg: svgText.replace(/var\((--[\w-]+)\)/g, (m, n) => vars[n] || m), w, h };
}
function exportSVG() {
  const r = buildExportSVG(); if (!r) return toast('Nothing to export yet', 'warn');
  download(fileSlug() + '.svg', '<?xml version="1.0" encoding="UTF-8"?>\n' + r.svg, 'image/svg+xml');
}
async function exportPNG() {
  const r = buildExportSVG(); if (!r) return toast('Nothing to export yet', 'warn');
  const scale = Math.min(2, 8000 / Math.max(r.w, r.h));
  const url = URL.createObjectURL(new Blob([r.svg], { type: 'image/svg+xml' }));
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('render failed')); img.src = url; });
    const cv = document.createElement('canvas'); cv.width = Math.round(r.w * scale); cv.height = Math.round(r.h * scale);
    const ctx = cv.getContext('2d'); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, r.w, r.h);
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    download(fileSlug() + '.png', blob);
  } catch (e) { toast('PNG export failed: ' + e.message, 'err'); }
  finally { URL.revokeObjectURL(url); }
}
/** Fill the hidden #print block (drawing + legend + cable list + port issues) and open the print dialog. */
function buildPrintLayout() {
  const r = buildExportSVG({ legend: false, forceLight: true });
  const rows = sortRows(cableRows(), 'code', 1), ports = portRows();
  const total = rows.reduce((s, x) => s + (+x.length || 0), 0);
  const multi = ports.filter(p => p.status === 'multi'), unused = ports.filter(p => p.status === 'unused');
  const legend = SIGNAL_KEYS.map(k => { const s = sigOf(k); return `<span><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="${esc(s.color)}" stroke-width="${s.width}"${s.dash ? ` stroke-dasharray="${esc(s.dash)}"` : ''}/></svg>${esc(s.label)} <small>(${esc(s.prefix)})</small></span>`; }).join('');
  $('#print').innerHTML = `<h1>${esc(Store.main.name)}</h1>
    <div class="pmeta">Patch plan · printed ${new Date().toLocaleString()} · ${Object.keys(Store.doc.devices).length} devices · ${rows.length} cables · ${Math.round(total * 10) / 10} m of cable</div>
    <div class="pdrawing">${r ? r.svg : '<p>(empty drawing)</p>'}</div>
    <h2>Legend</h2><div class="plegend">${legend}</div>
    <h2>Cable list</h2>
    <table><thead><tr>${CABLE_COLS.map(c => `<th>${c[1]}</th>`).join('')}<th>⚠</th></tr></thead><tbody>
    ${rows.map(x => `<tr>${CABLE_COLS.map(([k]) => `<td>${k === 'code' ? `<span class="sw-dot" style="background:${esc(x.color)};-webkit-print-color-adjust:exact;print-color-adjust:exact"></span>` : ''}${esc(x[k])}</td>`).join('')}<td>${esc(x.warn.join('; '))}</td></tr>`).join('')}
    </tbody></table>
    <h2>Port usage issues</h2>
    <p>${unused.length} unconnected port${unused.length === 1 ? '' : 's'} · ${multi.length} port${multi.length === 1 ? '' : 's'} with more than one cable</p>
    ${multi.length ? `<table><thead><tr><th>Device</th><th>Port</th><th>Type</th><th>Cables</th></tr></thead><tbody>${multi.map(p => `<tr><td>${esc(p.dev)}</td><td>${esc(p.port)}</td><td>${esc(p.typeLabel)}</td><td>${esc(p.cables)}</td></tr>`).join('')}</tbody></table>` : ''}`;
}
function printLayout() { buildPrintLayout(); setTimeout(() => window.print(), 50); }

/* =====================================================================
   15. VIEW MODE — read-only
   ===================================================================== */
function setViewMode(on) {
  UI.viewMode = on;
  document.body.classList.toggle('viewmode', on);
  $('#btnView').classList.toggle('on', on);
  $('#stMode').hidden = !on; $('#stMode').textContent = '👁 View only — editing locked';
  $('#docName').disabled = on; $('#selRouting').disabled = on;
  $('#btnUndo').hidden = on; $('#btnRedo').hidden = on;
  try { localStorage.setItem('patchplan.viewmode', on ? '1' : ''); } catch {}
  renderSelection(); renderInspector();
}
$('#btnView').onclick = () => { setViewMode(!UI.viewMode); toast(UI.viewMode ? 'View only: editing is locked' : 'Editing enabled'); };

/* File menu */
const FILE_CMDS = {
  new: () => { if (confirm('Start a new empty project? (The current one stays in autosave until you change something.)')) { Store.load(newDoc()); setChain(null); setSelection([]); UI.view = { x: 60, y: 60, k: 1 }; applyView(); } },
  open: openFileDialog, save: () => saveJSON(false), 'save-view': () => saveJSON(true), png: exportPNG, svg: exportSVG, print: printLayout,
  'csv-cables': () => exportCSV('cables'), 'csv-ports': () => exportCSV('ports'),
};
$('#btnFile').onclick = e => { e.stopPropagation(); $('#menuFile').classList.toggle('open'); };
$('#menuFile .menu-list').addEventListener('click', e => { const b = e.target.closest('[data-cmd]'); if (!b) return; $('#menuFile').classList.remove('open'); FILE_CMDS[b.dataset.cmd](); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu')) $$('.menu.open').forEach(m => m.classList.remove('open')); });

/* =====================================================================
   16. INIT
   ===================================================================== */
function toggleSnap() { UI.snap = !UI.snap; $('#btnSnap').classList.toggle('on', UI.snap); }
$('#btnSnap').onclick = toggleSnap;
function toggleLabels() { UI.showLabels = !UI.showLabels; $('#btnLabels').classList.toggle('on', UI.showLabels); render(); }
$('#btnLabels').onclick = toggleLabels;
$('#selRouting').onchange = e => Store.transact('Default routing', () => Store.update('meta', 'main', { routing: e.target.value }));
$('#btnFit').onclick = zoomToFit;
$('#btnZoomIn').onclick = () => zoomBy(1.2);
$('#btnZoomOut').onclick = () => zoomBy(1 / 1.2);
$('#btnUndo').onclick = () => Store.undo();
$('#btnRedo').onclick = () => Store.redo();
$('#docName').addEventListener('input', e => Store.transact('Rename project', () => Store.update('meta', 'main', { name: e.target.value }), { origin: 'insp', coalesce: 'docname' }));

Store.on(ev => {
  portIdx = null;
  // prune selection of deleted entities
  for (const id of [...UI.sel]) if (!entityOf(id)) UI.sel.delete(id);
  $('#selRouting').value = Store.main.routing;
  if (UI.focusPort && !Store.doc.devices[UI.focusPort.dev]?.ports.some(p => p.id === UI.focusPort.port)) UI.focusPort = null;
  requestRender();
  if (ev.origin !== 'insp') renderInspector();
  if (document.activeElement !== $('#docName')) $('#docName').value = Store.main.name;
  scheduleAutosave();
});

function demoDoc() {
  const doc = newDoc(); doc.meta.main.name = 'Demo show';
  const add = (i, x, y, name) => { const d = Ops.makeDevice(BUILTIN_PRESETS[i], x, y); if (name) d.name = name; doc.devices[d.id] = d; return d; };
  const pd = add(5, 0, 0), ms = add(2, 300, 0), sw = add(3, 300, 320), proc = add(0, 600, 0),
    t1 = add(1, 900, 0, 'LED Tile A1'), t2 = add(1, 900, 140, 'LED Tile A2'), node = add(4, 600, 320), ml = add(8, 900, 320, 'Spot 1');
  const port = (dev, label) => ({ dev: dev.id, port: dev.ports.find(p => p.label === label).id });
  const counters = {};
  const cab = (from, to, type, extra = {}) => {
    const pre = DEFAULT_SIGNALS[type].prefix; counters[pre] = (counters[pre] || 0) + 1;
    const c = { id: uid('c_'), code: `${pre}-${String(counters[pre]).padStart(3, '0')}`, type, color: null, label: '', length: '', connector: '', notes: '', from, to, waypoints: [], routing: '', ...extra };
    doc.cables[c.id] = c;
  };
  cab(port(pd, 'Out 1 16A'), port(ms, 'Power'), 'power', { length: 5, connector: 'powerCON TRUE1' });
  cab(port(pd, 'Out 2 16A'), port(proc, 'Power'), 'power', { length: 10, connector: 'powerCON TRUE1' });
  cab(port(pd, 'Out 3 16A'), port(sw, 'Power'), 'power', { length: 5 });
  cab(port(ms, 'Video Out 1'), port(proc, 'Video In 1'), 'video', { length: 3, connector: 'SDI BNC' });
  cab(port(proc, 'Out 1'), port(t1, 'Data In'), 'network', { length: 2, connector: 'etherCON Cat6' });
  cab(port(t1, 'Data Out'), port(t2, 'Data In'), 'network', { length: 1, connector: 'etherCON Cat6' });
  cab(port(sw, 'P1'), port(ms, 'Net A'), 'network', { length: 3 });
  cab(port(sw, 'P2'), port(node, 'Net'), 'network', { length: 15 });
  cab(port(node, 'DMX 1'), port(ml, 'DMX In'), 'dmx', { length: 10, label: 'Universe 1', connector: 'XLR 5-pin' });
  doc.meta.main.counters = counters;
  return doc;
}
renderLibrary();

$('#btnSnap').classList.toggle('on', UI.snap);
// Restore the last autosaved project, else start with the demo
(() => {
  let saved = null;
  try { saved = localStorage.getItem(AUTOSAVE_KEY); } catch {}
  let ok = false;
  if (saved) { try { Store.load(sanitizeDoc(JSON.parse(saved))); ok = true; $('#saveState').textContent = 'Restored autosave'; } catch {} }
  if (!ok) Store.load(demoDoc());
  let vm = /(^|[#?&])view\b/.test(location.hash + location.search);
  try { vm = vm || localStorage.getItem('patchplan.viewmode') === '1'; } catch {}
  if (vm) setViewMode(true);
})();
applyView();
requestAnimationFrame(zoomToFit);
</script>
